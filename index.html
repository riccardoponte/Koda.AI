<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Koda</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        /* --- STILE CSS ISPIRATO A SPOTIFY (Completo e Funzionante) --- */
        :root {
            --spotify-bg: #121212;
            --spotify-bg-light: #181818;
            --spotify-card: #282828;
            --spotify-ai-bubble-bg: #3e3e3e;
            /* NUOVO: Colore distinto per le bolle di testo dell'AI in dark mode */
            --spotify-text: #ffffff;
            --spotify-text-secondary: #b3b3b3;
            --spotify-accent: #1db954;
            --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            --bottom-nav-height: 70px;
        }

        /* NUOVO: Stili per la modalità Giorno (Light Mode) */
        body.light-mode {
            --spotify-bg: #ffffff;
            --spotify-bg-light: #f5f5f5;
            --spotify-card: #e9e9e9;
            --spotify-ai-bubble-bg: #e9e9e9;
            /* NUOVO: In light mode, le bolle AI usano un grigio chiaro */
            --spotify-text: #121212;
            --spotify-text-secondary: #535353;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            font-family: var(--font-family);
            background-color: var(--spotify-bg);
            color: var(--spotify-text);
            height: 100%;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Stili per la schermata di autenticazione */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--spotify-bg);
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s, visibility 0.5s;
            padding: 20px;
            overflow-y: auto;
        }

        #auth-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            fill: var(--spotify-accent);
        }

        .auth-card {
            background: var(--spotify-card);
            padding: 32px 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            margin: auto;
            flex-shrink: 0;
        }

        .auth-close-btn {
            position: absolute;
            top: 8px;
            left: 12px;
            background: none;
            border: none;
            color: var(--spotify-text-secondary);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
        }

        .auth-card h2 {
            font-size: 24px;
            margin-bottom: 24px;
        }

        .auth-card .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .auth-card label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .auth-card input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            background-color: var(--spotify-bg-light);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 8px;
            color: var(--spotify-text);
        }

        .auth-card input::placeholder {
            color: #888;
        }

        .auth-card .button {
            width: 100%;
            margin-top: 16px;
        }

        .auth-links {
            margin-top: 24px;
        }

        .auth-switch-link,
        .forgot-password-link {
            color: var(--spotify-text-secondary);
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
        }

        .auth-switch-link:hover,
        .forgot-password-link:hover {
            color: var(--spotify-text);
            text-decoration: underline;
        }

        .forgot-password-link {
            display: block;
            margin-top: 12px;
        }

        .auth-card.hidden {
            display: none;
        }

        #app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: var(--bottom-nav-height);
        }

        .top-bar {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            background: linear-gradient(to bottom, var(--spotify-bg) 70%, transparent);
            z-index: 10;
            width: 100%;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            flex-grow: 1;
            color: var(--spotify-text);
            margin: 0;
        }

        #global-controls {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .global-btn {
            background: none;
            border: none;
            color: var(--spotify-text);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .global-btn:hover {
            color: var(--spotify-accent);
        }

        #lang-toggle-btn {
            font-size: 14px;
            font-weight: bold;
            background: var(--spotify-card);
            border-radius: 50px;
            padding: 6px 10px;
            transition: background-color 0.2s ease;
        }

        #lang-toggle-btn:hover {
            background: var(--spotify-bg-light);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--spotify-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            object-fit: cover;
            color: black;
            position: relative;
            transition: transform 0.2s ease;
        }

        .user-avatar:hover {
            transform: scale(1.05);
        }

        /* User Profile Dropdown Menu */
        .user-profile-container {
            position: relative;
            display: inline-block;
        }

        .user-profile-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            /* MODIFICA: Allineato a sinistra invece che a destra per la responsività */
            margin-top: 8px;
            background-color: var(--spotify-card);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 200px;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            border: 1px solid rgba(128, 128, 128, 0.2);
        }

        .user-profile-dropdown.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-profile-header {
            padding: 16px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            text-align: center;
        }

        .user-profile-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--spotify-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            margin: 0 auto 8px;
            color: black;
        }

        .user-profile-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--spotify-text);
            margin-bottom: 4px;
        }

        .user-profile-email {
            font-size: 12px;
            color: var(--spotify-text-secondary);
        }

        .user-profile-menu {
            padding: 8px 0;
        }

        .user-profile-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--spotify-text);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .user-profile-item:hover {
            background-color: var(--spotify-bg-light);
        }

        .user-profile-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .user-profile-divider {
            height: 1px;
            background-color: rgba(128, 128, 128, 0.2);
            margin: 8px 0;
        }

        .user-profile-logout {
            color: #ff6b6b;
        }

        .user-profile-logout:hover {
            background-color: rgba(255, 107, 107, 0.1);
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 768px) {
            .user-profile-dropdown {
                position: fixed;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                margin: 0;
                border-radius: 12px 12px 0 0;
                min-width: auto;
                max-height: 80vh;
                overflow-y: auto;
            }

            .user-profile-dropdown.visible {
                transform: translateY(0);
            }

            .user-profile-header {
                padding: 20px 16px;
            }

            .user-profile-avatar {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }

            .user-profile-name {
                font-size: 18px;
            }

            .user-profile-item {
                padding: 16px;
                font-size: 16px;
            }

            .user-profile-item svg {
                width: 20px;
                height: 20px;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 12px 16px;
            }

            .page-title {
                font-size: 18px;
            }

            .user-avatar {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }

            .user-profile-dropdown {
                max-height: 70vh;
            }

            .user-profile-header {
                padding: 16px;
            }

            .user-profile-avatar {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }

            .user-profile-item {
                padding: 14px 16px;
                font-size: 15px;
            }

            .global-btn {
                font-size: 20px;
                padding: 6px;
            }

            #lang-toggle-btn {
                font-size: 12px;
                padding: 4px 8px;
            }
        }


        .filters-container {
            padding: 8px 16px;
            position: sticky;
            top: 64px;
            background-color: var(--spotify-bg);
            z-index: 9;
        }

        .filter-pills {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .filter-pills::-webkit-scrollbar {
            display: none;
        }

        .pill-btn {
            background-color: var(--spotify-card);
            color: var(--spotify-text);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s, color 0.2s;
        }

        .pill-btn.active {
            background-color: var(--spotify-text);
            color: var(--spotify-bg);
            font-weight: bold;
        }

        body.light-mode .pill-btn.active {
            color: var(--spotify-bg);
            background-color: #333;
        }

        /* NUOVO: Stili per l'icona mostra/nascondi password */
        .password-input-wrapper {
            position: relative;
        }

        .password-toggle-icon {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--spotify-text-secondary);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .password-toggle-icon svg {
            width: 20px;
            height: 20px;
        }

        #content-area {
            padding: 16px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .tool-card-grid {
            background: none;
            cursor: pointer;
        }

        .tool-card-grid .logo-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            background-color: var(--spotify-card);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            /* Needed for absolute positioning of edit icon */
        }

        .tool-card-grid .tool-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tool-card-grid .tool-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* NUOVO: Stile per la card "+" per aggiungere app */
        .add-app-card {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            border: 2px dashed var(--spotify-text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-app-card:hover {
            border-color: var(--spotify-accent);
            background-color: var(--spotify-card);
        }

        .add-app-card svg {
            width: 40px;
            height: 40px;
            fill: var(--spotify-text-secondary);
            transition: all 0.2s ease;
        }

        .add-app-card:hover svg {
            fill: var(--spotify-accent);
            transform: scale(1.1);
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-card-list {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .tool-card-list .logo-container {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            background-color: var(--spotify-card);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            /* Needed for absolute positioning of edit icon */
        }

        .tool-card-list .tool-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tool-card-list .info {
            flex-grow: 1;
        }

        .tool-card-list .tool-name {
            font-size: 16px;
            font-weight: 500;
        }

        .tool-card-list .tool-subtext {
            font-size: 13px;
            color: var(--spotify-text-secondary);
        }

        .tool-card-list .favorite-icon {
            font-size: 22px;
            color: var(--spotify-accent);
            margin-left: auto;
            padding: 10px;
            cursor: pointer;
        }

        /* NUOVO: Stili per i badge di prezzo */
        .pricing-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            vertical-align: middle;
        }

        .pricing-badge.free {
            background-color: rgba(29, 185, 84, 0.15);
            color: #1db954;
        }

        .pricing-badge.freemium {
            background-color: rgba(255, 193, 7, 0.15);
            color: #ffc107;
        }

        .pricing-badge.paid {
            background-color: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }

        .sent-review-item {
            background-color: var(--spotify-bg-light);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(128, 128, 128, 0.1);
        }

        .sent-review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .sent-review-tool-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sent-review-tool-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            background-color: var(--spotify-card);
        }

        .sent-review-tool-name {
            font-size: 16px;
            font-weight: 600;
        }

        .sent-review-actions {
            display: flex;
            gap: 8px;
        }

        .sent-review-delete-btn {
            background: none;
            border: 1px solid var(--spotify-text-secondary);
            color: var(--spotify-text);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sent-review-delete-btn:hover {
            background-color: #ff6b6b;
            border-color: #ff6b6b;
            color: #fff;
        }

        .tool-card-list .edit-icon {
            /* Style for edit icon in list view */
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: rgba(0, 0, 0, 0.6);
            /* Semi-transparent background */
            border-radius: 50%;
            width: 20px;
            /* Smaller icon */
            height: 20px;
            /* Smaller icon */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            /* Above the logo */
            color: white;
            /* White pencil icon */
            font-size: 12px;
            /* Adjust size as needed */
        }

        .tool-card-list .edit-icon svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }


        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .category-card {
            position: relative;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            overflow: hidden;
            aspect-ratio: 1.5 / 1;
            cursor: pointer;
        }

        .category-card h3 {
            position: relative;
            z-index: 2;
            color: #fff;
        }

        .category-card .logo-container {
            position: absolute;
            bottom: -10px;
            right: -20px;
            width: 80px;
            height: 80px;
            transform: rotate(25deg);
            z-index: 1;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .category-card .tool-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .search-bar-container {
            padding: 16px 56px 16px 16px;
        }

        #search-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            background-color: var(--spotify-card);
            border: none;
            border-radius: 8px;
            color: var(--spotify-text);
        }

        #search-input::placeholder {
            color: var(--spotify-text-secondary);
        }

        body.light-mode #search-input {
            background-color: var(--spotify-card);
            color: var(--spotify-text);
        }

        body.light-mode #search-input::placeholder {
            color: var(--spotify-text-secondary);
        }

        #empty-state {
            text-align: center;
            color: var(--spotify-text-secondary);
            padding: 40px;
        }

        #bottom-nav {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--bottom-nav-height);
            background: linear-gradient(to top, var(--spotify-bg) 80%, transparent);
            z-index: 100;
            border-top: 1px solid var(--spotify-card);
        }

        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: none;
            border: none;
            color: var(--spotify-text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-btn .icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-btn.active {
            color: var(--spotify-accent);
        }

        /* Badge di notifica per messaggi non letti */
        .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background-color: #ff4444;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid var(--spotify-bg);
        }

        .nav-btn .icon {
            position: relative;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1600;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        body.light-mode .modal-overlay {
            background: rgba(255, 255, 255, 0.6);
        }

        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Responsive modal overlay */
        @media (max-width: 768px) {
            .modal-overlay {
                /* Default to top alignment for potentially long content */
                align-items: flex-start;
                padding: 20px 0;
                /* Use symmetrical padding */
            }

            /* Specifically center overlays containing shorter, form-like modals */
            #add-ai-suggestion-modal,
            #settings-modal,
            #detail-modal,
            #change-nickname-modal,
            #change-password-modal,
            #manage-rankings-modal,
            #add-video-modal,
            /* NUOVO */
            #edit-video-modal

            /* NUOVO */
                {
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .modal-overlay {
                /* Default to top alignment */
                align-items: flex-start;
                padding: 10px 0;
            }

            /* Specifically center overlays containing shorter, form-like modals */
            #add-ai-suggestion-modal,
            #settings-modal,
            #detail-modal,
            #change-nickname-modal,
            #change-password-modal,
            #manage-rankings-modal {
                align-items: center;
            }
        }

        .modal-content {
            background: var(--spotify-card);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }

        .modal-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--spotify-text-secondary);
            font-size: 28px;
            cursor: pointer;
        }

        .button {
            background-color: var(--spotify-accent);
            color: #000;

        /* --- STILI PER IL "CURATED FEED" (NUOVO LAYOUT DI RICERCA) --- */

        .feed-section {
            margin-bottom: 48px;
            /* Ampio spazio tra le sezioni */
        }

        .feed-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            /* Allineato con il padding generale dell'app */
            margin-bottom: 20px;
        }

        .feed-section-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--spotify-text);
            margin: 0;
        }

        .see-all-btn {
            background: none;
            border: none;
            color: var(--spotify-text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease-in-out;
            padding: 8px;
            /* Area cliccabile più grande */

        .see-all-btn:hover {
            color: var(--spotify-accent);
        }

        .horizontal-scroll-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 0 16px 16px 16px;
            /* Aggiunge padding sotto per lo scroll snap e l'ombra */
            /* Nasconde la barra di scorrimento per un look pulito */
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
            scroll-snap-type: x mandatory;
            /* Abilita lo snapping orizzontale */
            scroll-padding: 0 16px;
            /* Assicura che lo snap non tagli gli elementi ai bordi */
        }

        .horizontal-scroll-container::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, and Opera */
        }

        .tool-item-horizontal {
            flex: 0 0 140px;
            /* Base di 140px, non si restringe, non si allarga */
            cursor: pointer;
            scroll-snap-align: start;
            /* Aggancia l'inizio dell'elemento allo scroll */
            transition: background-color 0.2s ease-in-out;
            border-radius: 8px;
            padding: 8px;
        }

        .tool-item-horizontal:hover {
            background-color: var(--spotify-bg-light);
            /* Feedback visivo standard al hover */
        }

        .tool-item-logo-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            background-color: var(--spotify-card);
            margin-bottom: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-item-logo-container .tool-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tool-item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--spotify-text);
            line-height: 1.3;
            /* Gestisce il testo su massimo 2 righe con troncamento */
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* --- STILI PER FEED NEWS (STILE TIKTOK/REELS) --- */
        .news-feed-container {
            height: calc(100dvh - var(--bottom-nav-height));
            /* Sottrae solo la navbar inferiore (barra superiore rimossa) */
            overflow-y: scroll;
            overscroll-behavior-y: contain;
            scroll-snap-type: y mandatory;
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
            background-color: #000;
        }

        .news-feed-container::-webkit-scrollbar {
            display: none;
            /* Nasconde la scrollbar */
        }

        .news-item {
            height: 100%;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background-size: cover;
            background-position: center;
        }

        .news-overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 40%, transparent 100%);
            padding: 30px 20px;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            color: #fff;
        }

        .news-date {
            font-size: 12px;
            color: var(--Koda-accent);
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .news-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .news-content {
            font-size: 15px;
            line-height: 1.5;
            color: #e0e0e0;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            /* Mostra massimo 4 righe */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-read-more-btn {
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            text-decoration: none;
        }

        .news-read-more-btn:hover {
            background-color: var(--Koda-accent);
            color: #000;
            border-color: var(--Koda-accent);
        }

        /* --- STILI PER CATALOGO VIDEO (FULLSCREEN & RESPONSIVE) --- */

        #video-catalog-modal.modal-overlay {

        @media (max-width: 600px) {

        /* ===== TASK 6: SISTEMA MODALI UNIFICATO ===== */
        /* Nessun padding attorno all'overlay quando contiene un pannello a tutta pagina */
        .modal-overlay:has(.modal-sheet) {
            padding: 0;
            align-items: center;
        }

        /* Pannello a tutta pagina (liste admin / form lunghi) */
        .modal-overlay .modal-sheet {
            width: 100%;
            max-width: 560px;
            height: 100vh;
            height: 100dvh;
            max-height: 100vh;
            max-height: 100dvh;
            margin: 0;
            padding: 0;
            border-radius: 0;
            text-align: left;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--spotify-bg);
        }

        @media (min-width: 640px) {
            .modal-overlay .modal-sheet {
                height: min(88dvh, 820px);
                max-height: 88dvh;
                border-radius: 20px;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
        }

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--spotify-bg);
            flex-shrink: 0;
        }

        .modal-sheet-title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.25;
            margin: 0;
        }

        .modal-icon-btn {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--spotify-card);
            color: var(--spotify-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .modal-icon-btn:hover {
            background: var(--spotify-ai-bubble-bg);
            transform: scale(1.05);
        }

        .modal-icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .modal-sheet-toolbar {

            flex-direction: column;
            gap: 12px;
            padding: 14px 20px 6px;
            flex-shrink: 0;
        }

            flex-direction: column;
            gap: 12px;

            justify-content: space-between;
            gap: 12px;

            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
        }

            width: 18px;
            height: 18px;
            accent-color: var(--spotify-accent);
            cursor: pointer;
        }

        .select-all-count {
            color: var(--spotify-text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }

            font-weight: 600;
            font-size: 14px;

        .pricing-type-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

            flex: 1 1 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 8px;
            background: var(--spotify-bg-light);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: var(--spotify-text);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .pricing-type-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .pricing-type-btn:hover {
            border-color: var(--spotify-accent);
            background: rgba(29, 185, 84, 0.12);
        }

            background: var(--spotify-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--spotify-text);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            flex-shrink: 0;

            align-items: center;
            justify-content: center;

            height: 16px;

            background: #ff6b6b;
            color: #fff;

            display: flex;
            align-items: center;
            gap: 12px;

            display: flex;

            gap: 8px;

            font-size: 14px;

            text-overflow: ellipsis;

        }

            border-radius: 10px;
            color: var(--spotify-text-secondary);

        }

            flex: 1 1 auto;
            min-width: 0;
        }

            margin-bottom: 8px;
        }

            text-align: left;

            padding-right: 44px;
            padding-bottom: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            background: var(--spotify-card);

                    const customs = [];
                    const overrides = {};
                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (data.builtInId) {
                            // Override di una categoria predefinita (rinomina/colore/nascondi).
                            overrides[data.builtInId] = {
                                nameIt: data.nameIt,
                                nameEn: data.nameEn,
                                color: data.color,
                                hidden: !!data.hidden
                            };
                        } else {
                            // Categoria personalizzata.
                            customs.push({
                                id: docSnap.id,
                                name: {
                                    it: data.nameIt || data.nameEn || 'Categoria',
                                    en: data.nameEn || data.nameIt || 'Category'
                                },
                                color: data.color || '#1db954',
                                isCustom: true
                            });
                        }
                    });
                    customs.sort((a, b) => a.name.it.localeCompare(b.name.it));
                    return { customs, overrides };
                } catch (error) {
                    console.error("Errore nel caricamento delle categorie:", error);
                    return { customs: [], overrides: {} };

                const userDocRef = doc(db, "users", currentUser.uid);

                        return;
                    }
                    const userData = userDocSnap.data();

                    // 2. Filtra l'array 'userTools' per rimuovere l'app specificata
                    const updatedUserTools = (userData.userTools || []).filter(tool => tool.id !== toolId);

                    // 3. Rimuovi l'app anche da altri array correlati (preferiti, in evidenza, etc.)
                    const updatedUserFeaturedTools = (userData.userFeaturedTools || []).filter(id => id !== toolId);
                    const updatedFavorites = (userData.favorites || []).filter(id => id !== toolId);
                    const updatedUserFeaturedReplacements = { ...(userData.userFeaturedReplacements || {}) };
                    for (const staticId in updatedUserFeaturedReplacements) {
                        if (updatedUserFeaturedReplacements[staticId] === toolId) {
                            delete updatedUserFeaturedReplacements[staticId];
                        }
                    }

                    // 4. Prepara l'oggetto con tutti i dati aggiornati da scrivere su Firestore
                    const updateData = {
                        userTools: updatedUserTools,
                        userFeaturedTools: updatedUserFeaturedTools,
                        userFeaturedReplacements: updatedUserFeaturedReplacements,
                        favorites: updatedFavorites
                    };

                    // 5. Scrivi i dati aggiornati su Firestore in un'unica operazione
                    await updateDoc(userDocRef, updateData);

                    // 6. Aggiorna lo stato locale per riflettere la rimozione nella UI
                    currentUser.userTools = updatedUserTools;
                    currentUser.userFeaturedTools = updatedUserFeaturedTools;

                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#39;');

                if (cardToShow) cardToShow.classList.remove('hidden');
            };

            const attachAuthListeners = () => {
                // Remove previous listeners to avoid duplicates
                // This is a bit heavy, ideally use event delegation or remove specific listeners
                // For this structure, re-attaching to the overlay is simpler.
                // Ensure the overlay itself is the target for delegation.

                // Clear existing listeners by replacing the element (simple but effective)
                const oldAuthOverlay = el.authOverlay;
                const newAuthOverlay = oldAuthOverlay.cloneNode(true);
                oldAuthOverlay.parentNode.replaceChild(newAuthOverlay, oldAuthOverlay);
                el.authOverlay = newAuthOverlay;


                el.authOverlay.addEventListener('click', (e) => {
                    const target = e.target;
                    const actionTarget = target.closest('[data-action]');

                    if (actionTarget) {
                        const action = actionTarget.dataset.action;
                        if (action === 'close-auth') { e.preventDefault(); closeAuthAndReturnToApp(); }
                        else if (action === 'show-login') { e.preventDefault(); showAuthCard('login-card'); }
                        else if (action === 'show-register') { e.preventDefault(); showAuthCard('register-card'); }
                        else if (action === 'show-forgot') { e.preventDefault(); showAuthCard('forgot-password-card'); }
                    }

                    // Handle button clicks directly (delegation is better but keeping original structure)
                    if (target.id === 'register-btn') {

                        const fullName = el.authOverlay.querySelector('#register-fullname').value.trim();
                        const email = el.authOverlay.querySelector('#register-email').value;
                        const password = el.authOverlay.querySelector('#register-password').value;

                        if (!nickname) { showToast(t.nicknameRequired); return; }
                        if (!fullName) { showToast(t.fullNameRequired); return; }
                        if (!email.includes('@') || password.length < 6) { showToast(t.passwordTooShort); return; }

                                nickname: nickname,

                                favorites: [],
                                userTools: [],
                                userFeaturedTools: [],

                    if (e.target.classList.contains('video-card')) {
                        draggedItem = e.target;
                        setTimeout(() => draggedItem.classList.add('dragging'), 0);
                        document.getElementById('save-video-order-btn').style.display = 'block';
                    }
                });

                container.addEventListener('dragend', () => {
                    if (draggedItem) {
                        draggedItem.classList.remove('dragging');
                        draggedItem = null;
                    }
                });

                container.addEventListener('dragover', e => {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(container, e.clientY);
                    const dragging = container.querySelector('.dragging');
                    if (dragging) {
                        if (afterElement == null) {
                            container.appendChild(dragging);
                        } else {
                            container.insertBefore(dragging, afterElement);
                        }
                    }
                });

                function getDragAfterElement(container, y) {
                    const draggableElements = [...container.querySelectorAll('.video-card:not(.dragging)')];
                    return draggableElements.reduce((closest, child) => {
                        const box = child.getBoundingClientRect();
                        const offset = y - box.top - box.height / 2;
                        if (offset < 0 && offset > closest.offset) {
                            return { offset: offset, element: child };
                        } else {
                            return closest;
                        }
                    }, { offset: Number.NEGATIVE_INFINITY }).element;
                }
            };

                    setTimeout(() => {
                        if (draggedItem) draggedItem.classList.add('dragging');
                    }, 0);
                });

                draggableItemsContainer.addEventListener('dragend', e => {
                    if (draggedItem) {
                        draggedItem.classList.remove('dragging');
                        draggedItem = null;
                    }
                });

                draggableItemsContainer.addEventListener('dragover', e => {
                    e.preventDefault(); // Necessary to allow drop
                    const afterElement = getDragAfterElement(draggableItemsContainer, e.clientY);
                    const currentlyDragged = document.querySelector('.dragging');
                    if (currentlyDragged) {
                        if (afterElement == null) {
                            draggableItemsContainer.appendChild(currentlyDragged);
                        } else {
                            draggableItemsContainer.insertBefore(currentlyDragged, afterElement);
                        }
                    }
                });

                function getDragAfterElement(container, y) {
                    const draggableElements = [...container.querySelectorAll('.tool-list-item:not(.dragging)')];

                    return draggableElements.reduce((closest, child) => {
                        const box = child.getBoundingClientRect();
                        const offset = y - box.top - box.height / 2;
                        if (offset < 0 && offset > closest.offset) {
                            return { offset: offset, element: child };
                        } else {
                            return closest;
                        }
                    }, { offset: Number.NEGATIVE_INFINITY }).element;

            const handleDeleteCategory = async (categoryId) => {

                const t = translations[currentLanguage];
                const isBuiltIn = builtInCategories.some(b => b.id === categoryId);

                const usedByCount = aiToolsData.filter(tool => tool.category === categoryId).length;
                let message = isBuiltIn ? t.confirmHideCategory : t.confirmDeleteCategory;
                if (usedByCount > 0) {
                    message += currentLanguage === 'it'
                        ? `\n\n${usedByCount} AI usano questa categoria e resteranno senza una categoria valida.`
                        : `\n\n${usedByCount} AI use this category and will be left without a valid category.`;
                }
                if (!confirm(message)) return;

                try {
                    if (isBuiltIn) {
                        // Le predefinite non si eliminano davvero: si nascondono con un override.
                        await setDoc(doc(db, "categories", categoryId), {
                            builtInId: categoryId, hidden: true

                            const rowToCancel = actionTarget.closest('.alternative-row');
                            const altCol = rowToCancel.querySelector('.alt-ai-col');
                            if (altCol.dataset.originalHtml) {
                                altCol.innerHTML = altCol.dataset.originalHtml;
                                delete altCol.dataset.editing;
                                delete altCol.dataset.originalHtml;
                            }
                            break;
                        case 'update-alternative':
                            handleUpdateAlternative(actionTarget.dataset.mainId, actionTarget.dataset.altId);
                            break;
                        case 'remove-alternative':
                            handleRemoveAlternative(actionTarget.dataset.id);
                            break;
                        case 'submit-global-tool':
                            console.log('submit-global-tool action triggered');
                            handleAddGlobalTool();
                            break;
                        case 'open-edit-global-tool-modal':
                            openEditGlobalToolModal(actionTarget.dataset.id);
                            break;
                        case 'submit-edit-global-tool':
                            console.log('submit-edit-global-tool action triggered');
                            handleEditGlobalTool(actionTarget.dataset.id);
                            break;
                        case 'delete-global-tool':
                            handleDeleteGlobalTool(actionTarget.dataset.id);
                            break;
                        // NUOVO: Gestisce il click sull'icona della password
                        case 'toggle-password-visibility':
                            handlePasswordVisibilityToggle(actionTarget);
                            break;
                        // NUOVO: Gestisce i filtri della Libreria
                        case 'set-library-tab':
                            const tab = actionTarget.dataset.tab;
                            if (tab && tab !== libraryTab) {
                                libraryTab = tab;
                                renderView(); // Un re-render completo è il modo più semplice per aggiornare tutto
                            }
                            break;
                        // Global Controls
                        case 'open-settings-modal':
                            if (!currentUser.uid) { triggerAuthFlow(); } else { window.openSettingsModal(); }
                            break;
                        case 'logout':
                            signOut(auth).catch(error => console.error("Logout Error:", error));
                            break; // Rimuovi il logout dal global controls

                        // Auth Prompts (from Library page)
                        case 'prompt-login': triggerAuthFlow('login-card'); break;
                        case 'prompt-register': triggerAuthFlow('register-card'); break;

                        // Explore/Top AI Filters
                        case 'back-to-explore': exploreFilter = { type: null, value: null }; renderView(); break;
                        case 'set-explore-filter':
                            exploreFilter.type = actionTarget.dataset.filterType;
                            exploreFilter.value = actionTarget.dataset.filterValue;
                            renderView();
                            break;
                        case 'set-ranking-filter':
                            rankingFilter = actionTarget.dataset.filter;
                            renderView(); // Re-render to apply ranking filter
                            break;
                        case 'set-favorite-filter':
                            activeFilter = actionTarget.dataset.filter;
                            renderView(); // Re-render to apply favorite filter
                            break;

                        case 'navigate':
                            const page = actionTarget.dataset.page;
                            if (page && page !== currentView) {
                                currentView = page;
                                renderView();
                            }
                            break;
                        // Modals (Detail, Settings, Add App, Replace Featured)
                        case 'close-modal': closeModal(); break;
                        case 'toggle-favorite': toggleFavorite(actionTarget.dataset.id); break;
                        case 'open-detail-modal': // For recommendation box in detail modal
                            window.openDetailModal(actionTarget.dataset.id);
                            break;
                        case 'open-add-app-modal':
                            // MODIFICATO: Rimosso il controllo isPrivileged.
                            // Ora qualsiasi utente loggato può aggiungere un'app.
                            if (currentUser.uid) {
                                openAddAppModal();
                            } else {
                                triggerAuthFlow(); // Se non è loggato, chiedi di accedere.
                            }
                            break;
                        case 'open-edit-app-modal':
                            if (currentUser.uid) {
                                openEditAppModal(actionTarget.dataset.id);
                            } else {
                                triggerAuthFlow();
                            }
                            break;
                        case 'toggle-user-featured': // Triggered by pencil on user featured apps in Library
                            // Allow any logged-in user to perform this action
                            if (currentUser.uid) {
                                toggleUserFeatured(actionTarget.dataset.id);
                            } else {
                                triggerAuthFlow();
                            }
                            break;
                        case 'replace-featured-static': // Triggered by pencil on static featured apps in Top AI
                            // Allow any logged-in user to perform this action
                            if (currentUser.uid) {
                                openReplaceFeaturedModal(actionTarget.dataset.id);
                            } else {
                                triggerAuthFlow();
                            }
                            break;
                        case 'select-user-tool-for-featured': // Triggered by clicking a user app in the replace modal
                            // Allow any logged-in user to perform this action
                            if (currentUser.uid) {
                                replaceFeaturedStatic(actionTarget.dataset.staticId, actionTarget.dataset.userId);
                            } else {
                                triggerAuthFlow();
                            }
                            break;
                        case 'remove-user-tool': // Triggered by pencil on user apps in the main Library list
                            // Allow any logged-in user to perform this action
                            if (currentUser.uid) {
                                removeUserTool(actionTarget.dataset.id);
                            } else {
                                triggerAuthFlow();
                            }
                            break;
                        case 'add-ai-suggestion': // Triggered by add AI suggestion button
                            console.log('add-ai-suggestion action triggered');
                            if (currentUser.uid) {
                                console.log('User logged in, calling addAiSuggestion');
                                window.addAiSuggestion();
                            } else {
                                console.log('No user logged in, triggering auth flow');
                                triggerAuthFlow();
                            }
                            break;
                        case 'remove-ai-suggestion': // Triggered by remove AI suggestion button
                            if (currentUser.uid) {
                                removeAiSuggestion(actionTarget.dataset.id);
                            } else {
                                triggerAuthFlow();
                            }
                            break;
                        // Auth Overlay actions are handled by attachAuthListeners on the overlay itself
                        case 'close-auth': // Handled by attachAuthListeners
                        case 'show-login': // Handled by attachAuthListeners
                        case 'show-register': // Handled by attachAuthListeners
                        case 'show-forgot': // Handled by attachAuthListeners
                            // Let the specific auth overlay listener handle these
                            return;
                        case 'profile-avatar-click':
                            if (!currentUser.uid) {
                                triggerAuthFlow('register-card');
                            } else {
                                toggleUserProfileDropdown();
                            }
                            break;
                        case 'open-settings':
                            closeUserProfileDropdown();
                            window.openSettingsModal();
                            break;
                        case 'logout':
                            closeUserProfileDropdown();
                            handleLogout(); // Usa la nuova funzione centralizzata
                            break;
                    }
                    // Prevent default for any element with data-action
                    e.preventDefault();
                    return; // Stop processing after handling a data-action
                }

                // 4. Handle clicks on tool/ranking cards (excluding favorite icon and edit icon which have data-actions)
                const toolCard = target.closest('.tool-card-grid, .tool-card-list, .ranking-item, .tool-item-horizontal, .tool-shelf-item');
                if (toolCard && !target.closest('.favorite-icon') && !target.closest('.edit-icon')) {
                    window.openDetailModal(toolCard.dataset.id);
                    return;
                }

                // 5. Handle clicks outside modals to close them
                if (target.matches('.modal-overlay')) { closeModal(); return; }

                // 6. Close user profile dropdown when clicking outside
                closeUserProfileDropdown();

                // If none of the above were clicked, let the default behavior happen
            });

            const getExploreFeedHTML = () => {
                const t = translations[currentLanguage];
                const toolsByCategory = {};
                const allTools = getAllToolsForCurrentUser();
                allTools.forEach(tool => {
                    const category = tool.category;
                    if (!toolsByCategory[category]) {
                        toolsByCategory[category] = [];
                    }
                    toolsByCategory[category].push(tool);
                });

                let feedHTML = '';
                categories.forEach(category => {
                    const categoryId = category.id;
                    const categoryName = getTranslatedCategoryName(categoryId);
                    const tools = toolsByCategory[categoryId] || [];

                    if (tools.length > 0) {
                        const seeAllText = (t && t.browseAll) ? t.browseAll : 'Vedi tutti';
                        feedHTML += `
                        <div class="feed-section">
                            <div class="feed-section-header">
                                <h2 class="feed-section-title">${categoryName}</h2>
                                <button class="see-all-btn" data-action="set-explore-filter" data-filter-type="category" data-filter-value="${categoryId}">
                                    ${seeAllText} >
                                </button>
                            </div>
                            <div class="horizontal-scroll-container">
                                ${tools.map(tool => `
                                    <div class="tool-item-horizontal" data-id="${tool.id}">
                                        <div class="tool-item-logo-container">
                                            <img src="${tool.logoUrl}" class="tool-logo" alt="${tool.name}" loading="lazy">
                                        </div>
                                        <div class="tool-item-name">${tool.name}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    }
                });
                return feedHTML;
            };

            // --- SEARCH INPUT LISTENER ---
            el.mainContent.addEventListener('input', e => {
                if (e.target.id === 'search-input') {
                    const searchTerm = e.target.value.toLowerCase();
                    const contentArea = document.getElementById('content-area');
                    if (!contentArea) return;

                    const allTools = getAllToolsForCurrentUser(); // Search across all tools
                    const t = translations[currentLanguage];

                    if (searchTerm.length > 1) {
                        const toolsToShow = allTools.filter(tool =>
                            tool.name.toLowerCase().includes(searchTerm) ||
                            (typeof tool.description === 'string' ? tool.description.toLowerCase().includes(searchTerm) : (typeof tool.description === 'object' ? (tool.description[currentLanguage] || tool.description['en'] || '').toLowerCase().includes(searchTerm) : false))
                        );

                        // Pass context 'explore' to createListCard for search results
                        contentArea.innerHTML = toolsToShow.length > 0 ? `<div class="list-container">${toolsToShow.map(tool => createListCard(tool, 'explore')).join('')}</div>` : `<div id="empty-state">${t.noResultsFor} "${searchTerm}"</div>`;
                    } else {
                        // If search term is cleared, restore the original feed view WITHOUT a full re-render
                        contentArea.innerHTML = getExploreFeedHTML();
                    }
                    applyTranslations(currentLanguage); // Apply translations to search results/empty state
                }
            });

            // --- FIREBASE AUTH STATE CHANGE LISTENER ---
            onAuthStateChanged(auth, async (user) => { // Aggiungi "async" qui
                // --- INSERT THIS CODE ---
                // Check the URL hash to set the initial view
                const initialHash = window.location.hash.substring(1); // e.g., 'explore' from '#explore'
                const validPages = ['top-ai', 'explore', 'news', 'video']; // Removed home, user-chats, favorites, search-users

                if (initialHash && validPages.includes(initialHash)) {
                    currentView = initialHash;
                } else {
                    // Default to top-ai view if hash is missing or invalid
                    currentView = 'top-ai';
                    // Use replaceState to set the initial history entry without creating a new one
                    history.replaceState({ page: 'top-ai' }, '', '#top-ai');
                }
                // --- END OF INSERTION ---
                // Carica tutti i dati da Firestore PRIMA di inizializzare l'app
                let fetchedCategories;
                [aiToolsData, aiRankingsData, youtubeVideosData, newsData, fetchedCategories] = await Promise.all([
                    fetchToolsFromFirestore(),
                    fetchRankingsFromFirestore(),
                    fetchVideosFromFirestore(),
                    fetchNewsFromFirestore(),
                    fetchCategoriesFromFirestore()
                ]);
                const catData = fetchedCategories || { customs: [], overrides: {} };
                customCategories = catData.customs;
                categoryOverrides = catData.overrides;
                rebuildCategories();

                if (user) {
                    // L'utente è loggato, avvia l'app con i suoi dati.
                    console.log("User is logged in:", user.uid);
                    initializeAppWithUser(user); // Funzione già esistente, la usiamo qui

                } else {
                    // L'utente non è loggato (o ha fatto logout), avvia l'app in modalità ospite.
                    console.log("User is a guest or logged out.");

                    initializeAppForGuest();
                }
            });

        });
    </script>

</body>
